{{- define "resources" }}
        resources:
{{- if .Requests }}
          requests:
{{- range $key, $value := .Requests }}
            {{ $key }}: "{{$value -}}"
{{- end }}
{{- end }}
{{- if .Limits }}
          limits:
{{- range $key, $value := .Limits }}
            {{ $key }}: "{{$value -}}"
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: skupper-router
    app.kubernetes.io/part-of: skupper
    application: skupper-router
    skupper.io/component: router
    skupper.io/type: site
{{- if .Labels }}
{{- range $key, $value := .Labels }}
    {{ $key }}: {{$value -}}
{{- end }}
{{- end }}
{{- if .Annotations }}
  annotations:
{{- range $key, $value := .Annotations }}
    {{ $key }}: {{$value -}}
{{- end }}
{{- end }}
  name: {{ .Group }}
  ownerReferences:
  - apiVersion: skupper.io/v2alpha1
    kind: Site
    name: {{ .SiteName }}
    uid: {{ .SiteId }}
{{- if .RouterControl }}
    controller: true
    blockOwnerDeletion: true
{{- end }}
spec:
  replicas: {{ .Replicas }}
  selector:
    matchLabels:
      skupper.io/component: router
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
        skupper.io/config-digest: {{ .ConfigDigest }}
{{- if .PodAnnotations }}
{{- range $key, $value := .PodAnnotations }}
        {{ $key }}: {{$value -}}
{{- end }}
{{- end }}
      labels:
        app.kubernetes.io/name: skupper-router
        app.kubernetes.io/part-of: skupper
        application: skupper-router
        skupper.io/component: router
        skupper.io/group: {{ .Group }}
        skupper.io/type: site
{{- if .PodLabels }}
{{- range $key, $value := .PodLabels }}
        {{ $key }}: {{$value -}}
{{- end }}
{{- end }}
    spec:
      containers:
      - env:
        - name: QDROUTERD_CONF
          value: /etc/skupper-router-certs/skrouterd.json
        - name: QDROUTERD_CONF_TYPE
          value: json
        - name: SKUPPER_SITE_ID
          value: {{ .SiteId }}
        image: {{ .RouterImage.Name }}
        imagePullPolicy: {{ .RouterImage.PullPolicy }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: router
{{- if not .DisableSecCtx }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
{{- end }}
        ports:
        - containerPort: 5671
          name: amqps
          protocol: TCP
        - containerPort: 9090
          name: http
          protocol: TCP
        - containerPort: 55671
          name: inter-router
          protocol: TCP
        - containerPort: 45671
          name: edge
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 1
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /etc/skupper-router-certs
          name: skupper-router-certs
        - mountPath: /etc/skupper-router-proxies
          name: skupper-router-proxies
{{- if .Sizing.Router.NotEmpty -}}
        {{- template "resources" .Sizing.Router -}}
{{- end }}
      - env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
{{- if .RouterControl }}
        - name: SKUPPER_NAMESPACE_UID
          value: {{ .RouterControl.NamespaceUID }}
        - name: SKUPPER_SITE_UID
          value: {{ .RouterControl.SiteUID }}
        - name: SKUPPER_ROUTER_GROUP
          value: {{ .Group }}
        - name: SKUPPER_CONFIG_DIR
          value: /etc/skupper-router-certs
        - name: SKUPPER_CONTROLLER_ENROLLMENT_URL
          value: {{ .RouterControl.EnrollmentURL }}
        - name: SKUPPER_CONTROLLER_CONTROL_ADDRESS
          value: {{ .RouterControl.ControlAddress }}
        - name: SKUPPER_CONTROLLER_SERVER_NAME
          value: {{ .RouterControl.TLSServerName }}
        - name: SKUPPER_CONTROLLER_ENROLLMENT_TOKEN
          value: {{ .RouterControl.TokenPath }}
        - name: SKUPPER_CONTROLLER_CA
          value: {{ .RouterControl.CABundlePath }}
{{- else }}
        - name: SKUPPER_SITE_ID
          value: {{ .SiteId }}
        - name: SKUPPER_SITE_NAME
          value: {{ .SiteName }}
        - name: SKUPPER_ROUTER_CONFIG
          value: {{ .Group }}
{{- end }}
        - name: SKUPPER_ROUTER_DEPLOYMENT
          value: {{ .Group }}
        image: {{ .AdaptorImage.Name }}
        imagePullPolicy: {{ .AdaptorImage.PullPolicy }}
        name: kube-adaptor
{{- if not .DisableSecCtx }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
{{- end }}
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9191
            scheme: HTTP
          initialDelaySeconds: 1
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        ports:
        - containerPort: 9000
          name: metrics
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/skupper-router-certs
          name: skupper-router-certs
        - mountPath: /etc/skupper-router-proxies
          name: skupper-router-proxies
{{- if .RouterControl }}
        - mountPath: {{ .RouterControl.TokenDirectory }}
          name: router-control-token
          readOnly: true
        - mountPath: {{ .RouterControl.CABundleDirectory }}
          name: router-control-ca
          readOnly: true
{{- end }}
{{- if .Sizing.Adaptor.NotEmpty -}}
        {{- template "resources" .Sizing.Adaptor -}}
{{- end }}
      initContainers:
      - env:
{{- if .RouterControl }}
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: SKUPPER_NAMESPACE_UID
          value: {{ .RouterControl.NamespaceUID }}
        - name: SKUPPER_SITE_UID
          value: {{ .RouterControl.SiteUID }}
        - name: SKUPPER_ROUTER_GROUP
          value: {{ .Group }}
        - name: SKUPPER_CONFIG_DIR
          value: /etc/skupper-router-certs
        - name: SKUPPER_CONTROLLER_ENROLLMENT_URL
          value: {{ .RouterControl.EnrollmentURL }}
        - name: SKUPPER_CONTROLLER_CONTROL_ADDRESS
          value: {{ .RouterControl.ControlAddress }}
        - name: SKUPPER_CONTROLLER_SERVER_NAME
          value: {{ .RouterControl.TLSServerName }}
        - name: SKUPPER_CONTROLLER_ENROLLMENT_TOKEN
          value: {{ .RouterControl.TokenPath }}
        - name: SKUPPER_CONTROLLER_CA
          value: {{ .RouterControl.CABundlePath }}
{{- else }}
        - name: SKUPPER_ROUTER_CONFIG
          value: {{ .Group }}
{{- end }}
        image: {{ .AdaptorImage.Name }}
        imagePullPolicy: {{ .AdaptorImage.PullPolicy }}
        name: config-init
{{- if not .DisableSecCtx }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
{{- end }}
        command: ["/app/kube-adaptor", "-init"]
        volumeMounts:
        - mountPath: /etc/skupper-router-certs
          name: skupper-router-certs
        - mountPath: /etc/skupper-router-proxies
          name: skupper-router-proxies
{{- if .RouterControl }}
        - mountPath: {{ .RouterControl.TokenDirectory }}
          name: router-control-token
          readOnly: true
        - mountPath: {{ .RouterControl.CABundleDirectory }}
          name: router-control-ca
          readOnly: true
{{- end }}
{{- if .Sizing.Adaptor.NotEmpty -}}
        {{- template "resources" .Sizing.Adaptor -}}
{{- end }}
{{- if .RouterControl }}
      serviceAccountName: {{ .ServiceAccount }}
{{- else }}
      serviceAccount: {{ .ServiceAccount }}
{{- end }}
      volumes:
      - emptyDir: {}
        name: skupper-router-certs
      - emptyDir: {}
        name: skupper-router-proxies
{{- if .RouterControl }}
      - name: router-control-token
        projected:
          sources:
          - serviceAccountToken:
              audience: {{ .RouterControl.TokenAudience }}
              expirationSeconds: 600
              path: {{ .RouterControl.TokenFile }}
      - configMap:
          items:
          - key: {{ .RouterControl.CABundleKey }}
            path: {{ .RouterControl.CABundleFile }}
          name: {{ .RouterControl.CABundleConfigMap }}
        name: router-control-ca
{{- end }}
{{- if not .DisableSecCtx }}
      securityContext:
        runAsNonRoot: true
{{- end }}
{{- if .EnableAntiAffinity}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  application: skupper-router
                  skupper.io/type: site
              topologyKey: "kubernetes.io/hostname"
{{- end }}
